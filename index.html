<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor da Casa - Cardápio</title>
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sabor da Casa">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf6f0;--card:#fff;--tx:#2b2118;--mut:#7a6b5d;--pri:#c0392b;--bd:#eadfd2;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--card:#241c16;--tx:#f3ebe2;--mut:#a89a8c;--pri:#e8604f;--bd:#3a2e25}}
:root[data-theme="dark"]{--bg:#17120e;--card:#241c16;--tx:#f3ebe2;--mut:#a89a8c;--pri:#e8604f;--bd:#3a2e25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
.hero{background:linear-gradient(135deg,#c0392b,#e67e22);color:#fff;padding:28px 18px 22px;text-align:center}
.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;opacity:.92;font-size:14px}
.badge{display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:99px;font-size:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
.tab{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.list{padding:14px;display:grid;gap:12px;max-width:640px;margin:0 auto}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;align-items:center}
.ico{font-size:40px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:12px;flex:none}
.info{flex:1;min-width:0}.info h3{margin:0;font-size:16px}.info p{margin:3px 0 6px;color:var(--mut);font-size:13px}
.price{font-weight:700;color:var(--pri)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:18px;cursor:pointer}
.qty button.minus{background:var(--bd);color:var(--tx)}
.qty span{min-width:18px;text-align:center;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:10}
.bar button{width:100%;max-width:640px;display:flex;justify-content:space-between;margin:0 auto;border:none;background:var(--ok);color:#fff;font-size:16px;font-weight:600;padding:14px 18px;border-radius:12px;cursor:pointer}
.bar button:disabled{background:var(--bd);color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h2{margin:0 0 10px}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.tot{border-top:1px solid var(--bd);margin-top:8px;padding-top:10px;font-weight:700;font-size:17px}
input,textarea,select{width:100%;margin-top:8px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.send{margin-top:12px;display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;font-weight:600;padding:14px;border-radius:12px;border:none;width:100%;font-size:16px;cursor:pointer}
.close{background:none;border:none;color:var(--mut);width:100%;margin-top:8px;padding:8px;font-size:14px;cursor:pointer}
.note{color:var(--mut);font-size:12px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header class="hero">
  <h1>🍽️ Sabor da Casa</h1>
  <p>Comida caseira, feita na hora • Santo André - SP</p>
  <span class="badge">Aberto hoje • 11h às 22h</span><br><button id="inst" style="display:none;margin-top:12px;border:none;background:#fff;color:#c0392b;font-weight:700;padding:9px 16px;border-radius:99px;cursor:pointer">📲 Instalar app</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main class="list" id="list"></main>
<div class="bar"><button id="open" disabled><span id="cnt">Seu carrinho está vazio</span><span id="sum"></span></button></div>

<div class="modal" id="modal"><div class="sheet">
  <h2>Seu pedido</h2>
  <div id="lines"></div>
  <div class="row tot"><span>Total</span><span id="total"></span></div>
  <input id="nome" placeholder="Seu nome">
  <select id="tipo"><option value="Entrega">Entrega</option><option value="Retirada">Retirada no local</option></select>
  <input id="end" placeholder="Endereço de entrega">
  <select id="pag"><option>Pix</option><option>Cartão na entrega</option><option>Dinheiro</option></select>
  <textarea id="obs" rows="2" placeholder="Observações (ex: sem cebola)"></textarea>
  <button class="send" id="send">Enviar pedido pelo WhatsApp</button>
  <button class="close" id="close">Continuar escolhendo</button>
  <p class="note">Protótipo de demonstração. Número e cardápio são fictícios.</p>
</div></div>

<script>
var WHATS="5511999999999";
var MENU=[
 {c:"Pratos",i:[
  {id:1,n:"Feijoada Completa",d:"Feijão preto, carnes, arroz, couve e farofa",p:42,e:"🍲"},
  {id:2,n:"Parmegiana de Frango",d:"Com arroz, fritas e salada",p:36,e:"🍗"},
  {id:3,n:"Strogonoff de Carne",d:"Arroz branco e batata palha",p:34,e:"🥘"},
  {id:4,n:"Salada Caesar",d:"Frango grelhado, croutons e parmesão",p:28,e:"🥗"}]},
 {c:"Lanches",i:[
  {id:5,n:"X-Burguer da Casa",d:"Blend 160g, queijo, alface e molho especial",p:26,e:"🍔"},
  {id:6,n:"X-Bacon",d:"Blend 160g, bacon crocante e cheddar",p:30,e:"🥓"},
  {id:7,n:"Porção de Batata Frita",d:"500g com cheddar e bacon",p:32,e:"🍟"}]},
 {c:"Bebidas",i:[
  {id:8,n:"Suco Natural 500ml",d:"Laranja, limão ou maracujá",p:10,e:"🍊"},
  {id:9,n:"Refrigerante Lata",d:"Coca-Cola, Guaraná ou Fanta",p:6,e:"🥤"},
  {id:10,n:"Água Mineral",d:"500ml, com ou sem gás",p:4,e:"💧"}]},
 {c:"Sobremesas",i:[
  {id:11,n:"Pudim de Leite",d:"Fatia generosa com calda de caramelo",p:12,e:"🍮"},
  {id:12,n:"Brownie com Sorvete",d:"Brownie quente e bola de baunilha",p:18,e:"🍫"}]}
];
var cart={},cat=0;
try{var s=localStorage.getItem("cart_demo");if(s)cart=JSON.parse(s)||{};}catch(e){}
function save(){try{localStorage.setItem("cart_demo",JSON.stringify(cart));}catch(e){}}
function brl(v){return "R$ "+v.toFixed(2).replace(".",",");}
function all(){var a=[];MENU.forEach(function(m){a=a.concat(m.i);});return a;}
function renderTabs(){
  var t=document.getElementById("tabs");t.innerHTML="";
  MENU.forEach(function(m,k){var b=document.createElement("button");b.className="tab"+(k===cat?" on":"");b.textContent=m.c;
    b.onclick=function(){cat=k;renderTabs();renderList();};t.appendChild(b);});
}
function renderList(){
  var l=document.getElementById("list");l.innerHTML="";
  MENU[cat].i.forEach(function(it){
    var q=cart[it.id]||0,d=document.createElement("div");d.className="item";
    d.innerHTML='<div class="ico">'+it.e+'</div><div class="info"><h3>'+it.n+'</h3><p>'+it.d+'</p><span class="price">'+brl(it.p)+'</span></div>'
    +'<div class="qty">'+(q?'<button class="minus" data-a="-" data-id="'+it.id+'">−</button><span>'+q+'</span>':'')+'<button data-a="+" data-id="'+it.id+'">+</button></div>';
    l.appendChild(d);
  });
}
document.getElementById("list").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=b.dataset.id;cart[id]=(cart[id]||0)+(b.dataset.a==="+"?1:-1);
  if(cart[id]<=0)delete cart[id];
  save();renderList();update();
});
function totals(){var n=0,s=0;all().forEach(function(it){var q=cart[it.id]||0;n+=q;s+=q*it.p;});return{n:n,s:s};}
function update(){
  var t=totals(),o=document.getElementById("open");
  o.disabled=t.n===0;
  document.getElementById("cnt").textContent=t.n?("🛒 Ver pedido ("+t.n+(t.n>1?" itens":" item")+")"):"Seu carrinho está vazio";
  document.getElementById("sum").textContent=t.n?brl(t.s):"";
}
function openCart(){
  var h="";all().forEach(function(it){var q=cart[it.id];if(q)h+='<div class="row"><span>'+q+'x '+it.n+'</span><span>'+brl(q*it.p)+'</span></div>';});
  document.getElementById("lines").innerHTML=h;
  document.getElementById("total").textContent=brl(totals().s);
  document.getElementById("modal").classList.add("open");
}
document.getElementById("open").onclick=openCart;
document.getElementById("close").onclick=function(){document.getElementById("modal").classList.remove("open");};
document.getElementById("tipo").onchange=function(){document.getElementById("end").style.display=this.value==="Entrega"?"block":"none";};
document.getElementById("send").onclick=function(){
  var nome=document.getElementById("nome").value.trim(),tipo=document.getElementById("tipo").value,end=document.getElementById("end").value.trim();
  if(!nome){alert("Informe seu nome.");return;}
  if(tipo==="Entrega"&&!end){alert("Informe o endereço de entrega.");return;}
  var m="*Novo pedido - Sabor da Casa*\n\n";
  all().forEach(function(it){var q=cart[it.id];if(q)m+=q+"x "+it.n+" - "+brl(q*it.p)+"\n";});
  m+="\n*Total: "+brl(totals().s)+"*\n\nCliente: "+nome+"\n"+tipo+(tipo==="Entrega"?": "+end:"")+"\nPagamento: "+document.getElementById("pag").value;
  var ob=document.getElementById("obs").value.trim();if(ob)m+="\nObs: "+ob;
  var url="https://wa.me/"+WHATS+"?text="+encodeURIComponent(m);
  var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
};
renderTabs();renderList();update();
var dp=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;document.getElementById("inst").style.display="inline-block";});
document.getElementById("inst").onclick=function(){if(dp){dp.prompt();dp=null;this.style.display="none";}};
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
</html>
